version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains direct personal email addresses.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains personally identifiable full names.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains personal telephone numbers.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains highly sensitive Social Security Numbers.

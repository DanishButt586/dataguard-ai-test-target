version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Direct PII containing individual's email address.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Direct PII containing individual's full name.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Direct PII containing individual's phone number.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Highly sensitive direct PII containing social security number.

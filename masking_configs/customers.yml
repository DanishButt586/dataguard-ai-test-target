version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains email addresses which are direct personally identifiable
        information (PII).
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains full names which are direct personally identifiable
        information (PII).
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains telephone numbers which are direct personally identifiable
        information (PII).
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains social security numbers which are highly sensitive personally
        identifiable information (PII).

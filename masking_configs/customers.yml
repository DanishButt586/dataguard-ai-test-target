version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains personal email address details.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains direct personally identifiable name information.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains personal telephone contact details.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains highly sensitive government-issued Social Security Number.

version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains customer email addresses, which are personally identifiable
        information (PII).
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains full names of customers, which is direct PII.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains customer phone numbers, which are PII.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains Social Security Numbers, which are highly sensitive
        PII.

version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Direct PII containing individual email addresses requiring masking
        to protect user privacy.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Direct PII identifying individuals by their full name.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Direct PII containing personal telephone contact information.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Highly sensitive PII representing Social Security Numbers requiring
        strict masking or redaction.

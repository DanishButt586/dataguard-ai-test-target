version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains personal email addresses which are direct identifiers.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains full names of individuals which are direct identifiers.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains personal phone numbers which are direct identifiers.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains Social Security Numbers which are highly sensitive national
        identifiers.

version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains email addresses which are direct identifiers and PII.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains customer full names which are direct identifiers and
        PII.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains telephone numbers which are direct identifiers and PII.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains Social Security Numbers which are highly sensitive direct
        identifiers and PII.

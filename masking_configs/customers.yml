version: 2
models:
- name: customers
  columns:
  - name: email_address
    meta:
      masking_policy: mask_email
      justification: Contains personal email addresses which are direct PII.
  - name: full_name
    meta:
      masking_policy: redact
      justification: Contains customer full names which are direct PII.
  - name: phone_number
    meta:
      masking_policy: mask_phone
      justification: Contains personal telephone numbers.
  - name: ssn
    meta:
      masking_policy: mask_ssn
      justification: Contains Social Security Numbers which are highly sensitive national
        identifiers.
